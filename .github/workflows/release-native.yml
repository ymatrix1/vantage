name: release-native

# Builds the native spool hook for the 5 D72 targets and assembles one npm package per target.
# It never publishes: pull requests, plain dispatches and calls from release.yml stop at
# `npm publish --dry-run`. The one gated publish lives in release.yml (job `publish-npm`, D91).

on:
  pull_request:
    paths:
      - packages/hooks-native/**
      - tools/assemble-native-packages.mjs
      - .github/workflows/release-native.yml
  workflow_dispatch:
    inputs:
      version:
        description: Version for the native packages (semver)
        required: true
        default: 0.0.0
  workflow_call:
    inputs:
      version:
        description: Version for the native packages (semver)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, triple: x86_64-pc-windows-msvc, runner: windows-latest, exe: .exe }
          - { target: darwin-arm64, triple: aarch64-apple-darwin, runner: macos-latest, exe: "" }
          - { target: darwin-x64, triple: x86_64-apple-darwin, runner: macos-latest, exe: "" }
          - { target: linux-x64, triple: x86_64-unknown-linux-gnu, runner: ubuntu-latest, exe: "" }
          - { target: linux-arm64, triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, exe: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Add Rust target
        run: rustup target add ${{ matrix.triple }}
      - name: Unit tests (targets the runner can execute)
        if: matrix.target != 'darwin-x64'
        run: cargo test --release --locked --target ${{ matrix.triple }}
        working-directory: packages/hooks-native
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}
        working-directory: packages/hooks-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hook-${{ matrix.target }}
          path: packages/hooks-native/target/${{ matrix.triple }}/release/vantage-hook${{ matrix.exe }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hook-*
          path: bins
      - name: Assemble one package per target
        env:
          VERSION: ${{ inputs.version || '0.0.0' }}
        run: |
          node tools/assemble-native-packages.mjs "$VERSION" npm-out \
            win32-x64=bins/hook-win32-x64/vantage-hook.exe \
            darwin-arm64=bins/hook-darwin-arm64/vantage-hook \
            darwin-x64=bins/hook-darwin-x64/vantage-hook \
            linux-x64=bins/hook-linux-x64/vantage-hook \
            linux-arm64=bins/hook-linux-arm64/vantage-hook
      - name: Publish dry run (always; no auth, nothing leaves the runner)
        run: |
          for d in npm-out/hook-*; do
            chmod +x "$d"/bin/* || true
            (cd "$d" && npm publish --dry-run --access public)
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: npm-out

name: release-native

# Builds the native spool hook for the 5 D72 targets and assembles one npm package per target.
# It never publishes on its own: pull requests and plain dispatches stop at `npm publish --dry-run`.
# A real publish needs a manual dispatch with publish=true AND confirm=publish, runs in the
# `npm-publish` environment, and reads the NPM_TOKEN secret of that environment. Neither the
# environment nor the secret is configured (docs/specs/ci.md); until they are, the
# publish job fails at the token check.

on:
  pull_request:
    paths:
      - packages/hooks-native/**
      - tools/assemble-native-packages.mjs
      - .github/workflows/release-native.yml
  workflow_dispatch:
    inputs:
      version:
        description: Version for the native packages (semver)
        required: true
        default: 0.0.0
      publish:
        description: Really publish to npm (needs the npm-publish environment)
        type: boolean
        default: false
      confirm:
        description: Type "publish" to confirm a real publish
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, triple: x86_64-pc-windows-msvc, runner: windows-latest, exe: .exe }
          - { target: darwin-arm64, triple: aarch64-apple-darwin, runner: macos-latest, exe: "" }
          - { target: darwin-x64, triple: x86_64-apple-darwin, runner: macos-latest, exe: "" }
          - { target: linux-x64, triple: x86_64-unknown-linux-gnu, runner: ubuntu-latest, exe: "" }
          - { target: linux-arm64, triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, exe: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Add Rust target
        run: rustup target add ${{ matrix.triple }}
      - name: Unit tests (targets the runner can execute)
        if: matrix.target != 'darwin-x64'
        run: cargo test --release --locked --target ${{ matrix.triple }}
        working-directory: packages/hooks-native
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}
        working-directory: packages/hooks-native
      - uses: actions/upload-artifact@v4
        with:
          name: hook-${{ matrix.target }}
          path: packages/hooks-native/target/${{ matrix.triple }}/release/vantage-hook${{ matrix.exe }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: bins
      - name: Assemble one package per target
        env:
          VERSION: ${{ inputs.version || '0.0.0' }}
        run: |
          node tools/assemble-native-packages.mjs "$VERSION" npm-out \
            win32-x64=bins/hook-win32-x64/vantage-hook.exe \
            darwin-arm64=bins/hook-darwin-arm64/vantage-hook \
            darwin-x64=bins/hook-darwin-x64/vantage-hook \
            linux-x64=bins/hook-linux-x64/vantage-hook \
            linux-arm64=bins/hook-linux-arm64/vantage-hook
      - name: Publish dry run (always; no auth, nothing leaves the runner)
        run: |
          for d in npm-out/hook-*; do
            chmod +x "$d"/bin/* || true
            (cd "$d" && npm publish --dry-run --access public)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-out

  publish:
    # Real publish: manual dispatch only, explicit opt-in and confirmation, protected environment.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.confirm == 'publish'
    needs: package
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-out
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is not configured in the npm-publish environment"; exit 1; }
          for d in npm-out/hook-*; do
            chmod +x "$d"/bin/* || true
            (cd "$d" && npm publish --access public)
          done
